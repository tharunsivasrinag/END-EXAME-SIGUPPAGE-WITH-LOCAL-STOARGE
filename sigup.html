<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up & Login with LocalStorage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-bottom: 8px;
      color: #111827;
      font-size: 24px;
    }

    p.subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button.logout-btn {
      background-color: #ef4444;
      margin-top: 20px;
    }

    button.logout-btn:hover {
      background-color: #dc2626;
    }

    .toggle-text {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #4b5563;
    }

    .toggle-text a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .message.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
    }

    .message.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #4ade80;
    }

    .hidden {
      display: none;
    }

    .user-info {
      background: #f9fafb;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Alert Message Box -->
    <div id="alertBox" class="message"></div>

    <!-- SIGN UP VIEW -->
    <div id="signupView">
      <h2>Create an Account</h2>
      <p class="subtitle">Data is saved directly to your browser's localStorage.</p>
      
      <form id="signupForm">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" placeholder="john@example.com" required />
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Minimum 6 characters" minlength="6" required />
        </div>
        <button type="submit">Sign Up</button>
      </form>

      <div class="toggle-text">
        Already have an account? <a id="toLoginLink">Log in</a>
      </div>
    </div>

    <!-- LOGIN VIEW -->
    <div id="loginView" class="hidden">
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in using your saved localStorage account.</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="john@example.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required />
        </div>
        <button type="submit">Log In</button>
      </form>

      <div class="toggle-text">
        Don't have an account? <a id="toSignupLink">Sign up</a>
      </div>
    </div>

    <!-- DASHBOARD VIEW (After Login) -->
    <div id="dashboardView" class="hidden">
      <h2>Dashboard</h2>
      <p class="subtitle">You are currently logged in.</p>
      
      <div class="user-info" id="userDetails"></div>
      
      <button id="logoutBtn" class="logout-btn">Log Out</button>
    </div>
  </div>

  <script>
    // DOM Elements
    const signupView = document.getElementById("signupView");
    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");
    const alertBox = document.getElementById("alertBox");

    const signupForm = document.getElementById("signupForm");
    const loginForm = document.getElementById("loginForm");
    const logoutBtn = document.getElementById("logoutBtn");

    const toLoginLink = document.getElementById("toLoginLink");
    const toSignupLink = document.getElementById("toSignupLink");

    // Helper: Show Status Messages
    function showMessage(text, type) {
      alertBox.textContent = text;
      alertBox.className = `message ${type}`;
      alertBox.style.display = "block";
    }

    function clearMessage() {
      alertBox.style.display = "none";
    }

    // Helper: Get & Save Users in localStorage
    function getUsers() {
      return JSON.parse(localStorage.getItem("users")) || [];
    }

    function saveUsers(users) {
      localStorage.setItem("users", JSON.stringify(users));
    }

    // View Switching
    function showView(view) {
      clearMessage();
      signupView.classList.add("hidden");
      loginView.classList.add("hidden");
      dashboardView.classList.add("hidden");
      view.classList.remove("hidden");
    }

    toLoginLink.addEventListener("click", () => showView(loginView));
    toSignupLink.addEventListener("click", () => showView(signupView));

    // Handle Sign Up
    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;

      const users = getUsers();

      // Check if email already exists
      if (users.some((user) => user.email === email)) {
        showMessage("An account with this email already exists.", "error");
        return;
      }

      // Add new user and save to localStorage
      const newUser = { name, email, password, createdAt: new Date().toLocaleDateString() };
      users.push(newUser);
      saveUsers(users);

      signupForm.reset();
      showView(loginView);
      showMessage("Account created successfully! Please log in.", "success");
    });

    // Handle Login
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      const users = getUsers();
      const matchedUser = users.find((u) => u.email === email && u.password === password);

      if (!matchedUser) {
        showMessage("Invalid email or password.", "error");
        return;
      }

      // Save active session
      localStorage.setItem("currentUser", JSON.stringify(matchedUser));
      loginForm.reset();
      loadDashboard(matchedUser);
    });

    // Load Dashboard View
    function loadDashboard(user) {
      showView(dashboardView);
      document.getElementById("userDetails").innerHTML = `
        <strong>Name:</strong> ${user.name}<br>
        <strong>Email:</strong> ${user.email}<br>
        <strong>Joined:</strong> ${user.createdAt}
      `;
    }

    // Handle Logout
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("currentUser");
      showView(loginView);
      showMessage("You have been logged out.", "success");
    });

    // Check Session on Page Load
    window.addEventListener("DOMContentLoaded", () => {
      const currentUser = JSON.parse(localStorage.getItem("currentUser"));
      if (currentUser) {
        loadDashboard(currentUser);
      }
    });
  </script>
</body>
</html>
